name: Validate operator customer gates

on:
  pull_request:
    branches: [main]
    paths:
      - "mrt_cn_routes.py"
      - "README.md"
      - "tools/validate_operator_outputs.py"
      - "tests/test_filters.py"
      - "tests/test_operator_customer_gates.py"
      - ".github/workflows/validate-operator-customer-gates.yml"
  push:
    branches: [main]
    paths:
      - "mrt_cn_routes.py"
      - "README.md"
      - "tools/validate_operator_outputs.py"
      - "tests/test_filters.py"
      - "tests/test_operator_customer_gates.py"
      - ".github/workflows/validate-operator-customer-gates.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: operator-gate-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run compile and unit tests
        run: |
          python -m py_compile mrt_cn_routes.py tools/validate_operator_outputs.py
          pytest -q

      - name: Generate sampled real IPv6 outputs
        run: |
          python mrt_cn_routes.py \
            --output-dir validation-dist \
            --cache-dir /tmp/cira-mrt-validation-cache \
            --sources routeviews \
            --collectors route-views6 \
            --max-files-per-source 1 \
            --parallel-downloads 2 \
            --parse-workers 2 \
            --timeout 240 \
            --parser native \
            --verbose

      - name: Validate sampled operator output
        run: |
          python tools/validate_operator_outputs.py \
            validation-dist \
            --baseline-dir dist \
            --report validation-report.json

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-gate-validation
          path: |
            validation-dist/
            validation-report.json
          if-no-files-found: warn
          retention-days: 14
